name: Changelog preview

# Renders the full changelog pipeline (shared generation plus this
# repository's own formats) for an existing tag without running builds
# or publishing anything.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to render, e.g. v1.0.7-fix-2(33).'
        required: true
        type: string
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  changelog:
    uses: ./.github/workflows/changelog.yml
    with:
      tag-name: ${{ inputs.tag }}
    secrets: inherit
