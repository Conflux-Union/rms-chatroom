name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Matches tags like v1.0.0(1), v1.0.6-fix-1(9)

jobs:
  extract-version:
    name: Extract Version Info
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.code }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Extract version and code from tag (e.g., v1.0.7-fix-2(33) -> 1.0.7-fix-2, 33)
          VERSION=$(echo $TAG_NAME | sed -E 's/v([^(]+)\(([^)]+)\)/\1/')
          CODE=$(echo $TAG_NAME | sed -E 's/v([^(]+)\(([^)]+)\)/\2/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT

          echo "Extracted: version=$VERSION, code=$CODE"

  generate-changelog:
    name: Generate Changelog (AI)
    runs-on: ubuntu-latest
    needs: extract-version
    timeout-minutes: 45
    permissions:
      contents: read  # gh release download of the previous history asset

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up changelog agent dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/changelog-venv"
          "$RUNNER_TEMP/changelog-venv/bin/pip" install --disable-pip-version-check --quiet 'anthropic==1.8.0'

      - name: Generate user-facing changelog
        env:
          CHANGELOG_API_KEY: ${{ secrets.CHANGELOG_API_KEY }}
          CHANGELOG_MODEL: ${{ vars.CHANGELOG_MODEL || 'mimo-v2.6-flash' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.extract-version.outputs.version_name }}
          VERSION_CODE: ${{ needs.extract-version.outputs.version_code }}
          TAG_NAME: ${{ needs.extract-version.outputs.tag_name }}
        run: |
          set -euo pipefail

          if [[ -z "${CHANGELOG_API_KEY:-}" ]]; then
            echo "::error::CHANGELOG_API_KEY secret is not configured for this repository. The AI changelog generator calls an Anthropic-compatible endpoint (cf.api.fan by default) and requires this key." >&2
            exit 1
          fi

          CURRENT_TAG="$TAG_NAME"
          # Previous tag by version sort — the same logic the release body
          # has always used; handles v1.0.24-fix-1(69) style tags.
          PREVIOUS_TAG=$(git tag --sort=-version:refname | { grep -A1 "^${CURRENT_TAG}$" || true; } | tail -n1)
          if [[ -z "$PREVIOUS_TAG" || "$PREVIOUS_TAG" == "$CURRENT_TAG" ]]; then
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
            COMMIT_RANGE="$PREVIOUS_TAG..HEAD"
            DIFF_RANGE="$COMMIT_RANGE"
            BASE_DESCRIPTION="the beginning of the project"
          else
            COMMIT_RANGE="$PREVIOUS_TAG..HEAD"
            DIFF_RANGE="$COMMIT_RANGE"
            BASE_DESCRIPTION="$PREVIOUS_TAG"
          fi

          echo "Generating changelog for $CURRENT_TAG (range $COMMIT_RANGE)"

          CHANGELOG_PATHS=(
            .
            ':(exclude).github/**'
            ':(exclude)scripts/**'
            ':(exclude)README.md'
            ':(exclude)pnpm-lock.yaml'
          )

          git log --reverse --no-merges \
            --perl-regexp --invert-grep --grep='^(test|docs|chore)(\([^)]*\))?:' \
            --format='Subject: %s%n%b%n---' \
            "$COMMIT_RANGE" -- "${CHANGELOG_PATHS[@]}" > commit-data.txt
          if [[ ! -s commit-data.txt ]]; then
            printf '%s\n' 'No commits were found in this release range.' > commit-data.txt
          fi

          git diff --find-renames --stat "$DIFF_RANGE" \
            -- "${CHANGELOG_PATHS[@]}" > file-changes.txt

          # What earlier releases already shipped, so the agent can tell new
          # changes from old ones without burning tool rounds on git archaeology.
          if [[ "$BASE_DESCRIPTION" != "the beginning of the project" ]]; then
            git log --oneline --no-merges -30 "$PREVIOUS_TAG" > prior-history.txt
          else
            : > prior-history.txt
          fi

          # The diff itself, embedded in the agent prompt (capped by the
          # agent): reading it costs zero tool rounds, so small releases can
          # be answered straight from the prompt.
          git diff --find-renames "$DIFF_RANGE" \
            -- "${CHANGELOG_PATHS[@]}" > release-diff.txt

          # Agent mode: the model investigates the repository on its own
          # through read-only tools (see .github/scripts/changelog_agent.py)
          # instead of only receiving the pre-collected context above.
          "$RUNNER_TEMP/changelog-venv/bin/python" .github/scripts/changelog_agent.py \
            --repo "$GITHUB_WORKSPACE" \
            --current "$CURRENT_TAG" \
            --base "$BASE_DESCRIPTION" \
            --commit-range "$COMMIT_RANGE" \
            --diff-range "$DIFF_RANGE" \
            --commits commit-data.txt \
            --files file-changes.txt \
            --prior-history prior-history.txt \
            --diff release-diff.txt \
            --output mimo-response.json

          if ! jq -er '
            select(.choices[0].finish_reason == "stop")
            | .choices[0].message.content
            | select(type == "string" and length > 0)
            | sub("^```(?:json)?[[:space:]]*"; "")
            | sub("[[:space:]]*```$"; "")
            | fromjson
            | select(type == "object")
            | select((keys - ["fixes", "improvements"]) | length == 0)
            | select(.improvements | type == "array")
            | select(.fixes | type == "array")
            | select((.improvements | length) + (.fixes | length) > 0)
            | select(all(.improvements[], .fixes[];
                type == "object"
                and ((keys - ["en", "zh"]) | length == 0)
                and (.en | type == "string" and length > 0)
                and (.zh | type == "string" and length > 0)
                and (.en | test("[\\r\\n]") | not)
                and (.zh | test("[\\r\\n]") | not)))
          ' mimo-response.json > generated-changelog.json; then
            echo "MiMo agent returned an invalid bilingual changelog payload" >&2
            printf 'content_bytes=%s\n' "$(jq -r '.choices[0].message.content // ""' mimo-response.json | wc -c)" >&2
            exit 1
          fi

          # Render one markdown half per language. The desktop updater
          # reassembles these into latest.json notes with a '---' separator
          # that AppUpdater.vue splits per locale.
          jq -r '
            def section($heading; $items; $key):
              if ($items | length) == 0 then ""
              else "### " + $heading + "\n\n" + ($items | map("- " + .[$key]) | join("\n"))
              end;
            [section("✨ 新增与改进"; .improvements; "zh"),
             section("🐛 问题修复"; .fixes; "zh")]
            | map(select(length > 0)) | join("\n\n")
          ' generated-changelog.json > notes-zh.md

          jq -r '
            def section($heading; $items; $key):
              if ($items | length) == 0 then ""
              else "### " + $heading + "\n\n" + ($items | map("- " + .[$key]) | join("\n"))
              end;
            [section("✨ New & Improved"; .improvements; "en"),
             section("🐛 Bug Fixes"; .fixes; "en")]
            | map(select(length > 0)) | join("\n\n")
          ' generated-changelog.json > notes-en.md

          mkdir -p release-notes
          {
            cat notes-zh.md
            printf '\n---\n\n'
            cat notes-en.md
            if [[ "$BASE_DESCRIPTION" != "the beginning of the project" ]]; then
              printf '\n\n**Full commit history:** [`%s...%s`](%s/%s/compare/%s...%s)\n' \
                "$PREVIOUS_TAG" "$CURRENT_TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
                "$PREVIOUS_TAG" "$CURRENT_TAG"
            fi
          } > release-notes/changelog.md

          # Structured manifest consumed by the Android updater (fetched as a
          # release asset) and embedded into web/desktop/Android builds.
          jq --arg version "$VERSION_NAME" --argjson code "$VERSION_CODE" \
             --arg tag "$TAG_NAME" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             '{version: $version, code: $code, tag: $tag, date: $date,
               improvements: .improvements, fixes: .fixes}' \
            generated-changelog.json > release-notes/changelog.json

          # Rolling history manifest (newest first, capped at 15 releases):
          # clients merge every release inside (installed code, latest code]
          # so skipped versions show their changes too. Carry the previous
          # release's history forward; releases predating the asset start a
          # fresh list.
          if [[ "$BASE_DESCRIPTION" != "the beginning of the project" ]]; then
            gh release download "$PREVIOUS_TAG" -R "$GITHUB_REPOSITORY" \
              -p changelog-history.json -O previous-changelog-history.json || true
          fi
          [[ -f previous-changelog-history.json ]] || printf '[]' > previous-changelog-history.json
          jq -s --slurpfile cur release-notes/changelog.json '
            [$cur[0]] + ((.[0] // []) | map(select(.code < $cur[0].code)) | .[0:14])
          ' previous-changelog-history.json > release-notes/changelog-history.json

          # changelog.ts consumed as-is by the web and desktop builds (same
          # delivery path as version.ts: committed placeholder, CI overwrite).
          python3 - release-notes/changelog-history.json release-notes/changelog.ts << 'PYEOF'
          import json
          import sys

          HEAD = """// Auto-generated by GitHub Actions on release builds - DO NOT EDIT.
          // The committed placeholder carries dev values (code 0, empty items);
          // release builds overwrite this file with the AI-generated changelog
          // history (newest first).

          export interface ChangelogEntry { en: string; zh: string }

          export interface ReleaseChangelog {
            version: string
            code: number
            tag?: string
            date: string
            improvements: ChangelogEntry[]
            fixes: ChangelogEntry[]
          }

          export const CHANGELOG_HISTORY: ReleaseChangelog[] = """

          TAIL = """

          export const CHANGELOG: ReleaseChangelog = CHANGELOG_HISTORY[0]

          /**
           * Flatten every release inside (fromCode, toCode] into one merged
           * view so a user who skipped versions sees all of their changes in
           * a single dialog. `history` is newest-first; entries render
           * oldest -> newest with duplicates (same English text) removed.
           * Returns the newest release unchanged when there is nothing to
           * merge (fresh installs, unknown fromCode).
           */
          export function mergeChangelog(
            history: ReleaseChangelog[],
            fromCode: number | null,
            toCode: number,
          ): ReleaseChangelog {
            const newest = history[0]
            if (fromCode == null || !Number.isFinite(fromCode) || fromCode >= toCode) {
              return newest
            }
            const window = history.filter(c => c.code > fromCode && c.code <= toCode).reverse()
            if (window.length === 0) return newest
            const improvements: ChangelogEntry[] = []
            const fixes: ChangelogEntry[] = []
            const add = (list: ChangelogEntry[], entry: ChangelogEntry) => {
              if (!list.some(item => item.en === entry.en)) list.push(entry)
            }
            for (const release of window) {
              release.improvements.forEach(entry => add(improvements, entry))
              release.fixes.forEach(entry => add(fixes, entry))
            }
            return { ...newest, improvements, fixes }
          }
          """

          with open(sys.argv[1], encoding="utf-8") as handle:
              history = json.load(handle)
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              handle.write(HEAD)
              handle.write(json.dumps(history, ensure_ascii=False, indent=2))
              handle.write(TAIL)
          PYEOF

          cp notes-zh.md notes-en.md release-notes/
          echo "--- changelog.md ---"
          cat release-notes/changelog.md
          echo "--- history entries: $(jq 'length' release-notes/changelog-history.json) ---"

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: release-changelog
          path: release-notes/
          if-no-files-found: error
          retention-days: 7

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [extract-version, generate-changelog]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: release-changelog
          path: release-notes

      - name: Bundle changelog into APK assets
        run: |
          mkdir -p apps/android/app/src/main/assets
          cp release-notes/changelog-history.json apps/android/app/src/main/assets/changelog-history.json
          echo "Bundled changelog history ($(jq 'length' apps/android/app/src/main/assets/changelog-history.json) releases)"

      - name: Update Android version in build.gradle.kts
        run: |
          VERSION_NAME="${{ needs.extract-version.outputs.version_name }}"
          VERSION_CODE="${{ needs.extract-version.outputs.version_code }}"

          sed -i "s/val appVersionCode = [0-9]*/val appVersionCode = $VERSION_CODE/" apps/android/app/build.gradle.kts
          sed -i "s/val appVersionName = \"[^\"]*\"/val appVersionName = \"$VERSION_NAME\"/" apps/android/app/build.gradle.kts

          echo "Updated Android version to: $VERSION_NAME ($VERSION_CODE)"
          grep -A 2 "appVersionCode\|appVersionName" apps/android/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android/gradlew

      - name: Decode and setup keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/android/app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd apps/android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  build-server:
    name: Build Server Bundle
    runs-on: ubuntu-latest
    needs: [extract-version, generate-changelog]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: release-changelog
          path: release-notes

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install dependencies
        run: pnpm install

      - name: Generate version file
        run: |
          VERSION_NAME="${{ needs.extract-version.outputs.version_name }}"
          VERSION_CODE="${{ needs.extract-version.outputs.version_code }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)

          cat > packages/shared/src/version.ts << EOF
          // Auto-generated by GitHub Actions - DO NOT EDIT
          export const VERSION_NAME: string = "$VERSION_NAME"
          export const VERSION_CODE: number = $VERSION_CODE
          export const COMMIT_HASH: string = "$COMMIT_HASH"
          EOF

          echo "Generated shared version.ts: $VERSION_NAME($VERSION_CODE)"

      - name: Install generated changelog module
        run: |
          # Prebuilt by the generate-changelog job; same delivery path as
          # version.ts (committed placeholder, CI overwrite) so the web
          # bundle embeds its version's changelog history.
          cp release-notes/changelog.ts packages/shared/src/changelog.ts
          echo "Installed shared changelog.ts:"
          sed -n '1,13p' packages/shared/src/changelog.ts

      - name: Build web frontend
        run: pnpm web:build

      - name: Build server binary
        run: |
          VERSION_NAME="${{ needs.extract-version.outputs.version_name }}"
          VERSION_CODE="${{ needs.extract-version.outputs.version_code }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION_PKG=github.com/RMS-Server/rms-discord-go/internal/version

          mkdir -p server-bundle
          cd server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X $VERSION_PKG.Name=$VERSION_NAME -X $VERSION_PKG.Code=$VERSION_CODE -X $VERSION_PKG.Commit=$COMMIT_HASH" \
            -o ../server-bundle/rms-discord-server ./cmd/server

      - name: Package server bundle and manifest
        env:
          VERSION_NAME: ${{ needs.extract-version.outputs.version_name }}
          VERSION_CODE: ${{ needs.extract-version.outputs.version_code }}
          TAG_NAME: ${{ needs.extract-version.outputs.tag_name }}
        run: |
          # Bundle layout is the deploy contract: the server's
          # frontend_dist_path points at packages/web/dist next to the
          # binary, so the tar keeps that name even though the repo path
          # is now apps/web/dist.
          mkdir -p server-bundle/packages/web
          cp -r apps/web/dist server-bundle/packages/web/dist

          mkdir -p server-assets
          ASSET_NAME="rms-chatroom-server-${VERSION_NAME}-linux-amd64.tar.gz"
          tar -czf "server-assets/$ASSET_NAME" -C server-bundle .

          # server-latest.json is the update manifest: the deploy job POSTs
          # it to the server, and periodic self-checks fetch it from
          # releases/latest/download/ through gh-proxy mirrors.
          python3 - "$ASSET_NAME" << 'PYEOF'
          import hashlib, json, os, sys
          from urllib.parse import quote
          asset = sys.argv[1]
          sha256 = hashlib.sha256(open(f'server-assets/{asset}', 'rb').read()).hexdigest()
          tag = quote(os.environ['TAG_NAME'], safe='')
          manifest = {
              'version': os.environ['VERSION_NAME'],
              'code': int(os.environ['VERSION_CODE']),
              'url': f'https://github.com/Conflux-Union/rms-chatroom/releases/download/{tag}/{asset}',
              'sha256': sha256,
          }
          with open('server-assets/server-latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Upload server bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-bundle
          path: server-assets/
          retention-days: 7

  build-desktop:
    name: Build Desktop (Tauri)
    runs-on: ${{ matrix.os }}
    needs: [extract-version, generate-changelog]

    strategy:
      matrix:
        include:
          - os: windows-latest
            args: '--target x86_64-pc-windows-msvc'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: release-changelog
          path: release-notes

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Generate version file
        shell: bash
        run: |
          VERSION_NAME="${{ needs.extract-version.outputs.version_name }}"
          VERSION_CODE="${{ needs.extract-version.outputs.version_code }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)

          cat > packages/shared/src/version.ts << EOF
          // Auto-generated by GitHub Actions - DO NOT EDIT
          export const VERSION_NAME: string = "$VERSION_NAME"
          export const VERSION_CODE: number = $VERSION_CODE
          export const COMMIT_HASH: string = "$COMMIT_HASH"
          EOF

          # Update tauri.conf.json version from tag
          node -e "const fs=require('fs');const f='apps/desktop/src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version='$VERSION_NAME';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

          echo "Generated shared version.ts and set tauri version to $VERSION_NAME($VERSION_CODE)"

      - name: Install generated changelog module
        shell: bash
        run: |
          # Prebuilt by the generate-changelog job; same content as the web
          # build so the desktop bundle embeds its version's changelog
          # history for the first-open popup.
          cp release-notes/changelog.ts packages/shared/src/changelog.ts
          echo "Installed shared changelog.ts"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri v2 expects TAURI_SIGNING_PRIVATE_KEY / _PASSWORD (v1 used
          # TAURI_PRIVATE_KEY); wrong names silently skip updater signing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          # Monorepo: the Rust shell lives under apps/desktop/src-tauri.
          projectPath: apps/desktop
          # Build only; the create-release job owns release creation and
          # asset upload. Without tagName/releaseId the action never enters
          # its release-upload path.
          args: ${{ matrix.args }}

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          # Tauri v2 updater artifacts: the NSIS installer itself plus the
          # minisign signature next to it (createUpdaterArtifacts: true
          # re-uses the bundle; only "v1Compatible" produces a .nsis.zip).
          path: |
            apps/desktop/src-tauri/target/*/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/*/release/bundle/nsis/*.exe.sig
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [extract-version, generate-changelog, build-android, build-desktop, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Determine release type
        id: release_type
        run: |
          VERSION="${{ needs.extract-version.outputs.version_name }}"

          # Determine release type
          if [[ $VERSION == *"-fix-"* ]] || [[ $VERSION == *"-fix" ]]; then
            echo "release_type=Hot-fix" >> $GITHUB_OUTPUT
          elif [[ $VERSION == *"-dev"* ]]; then
            echo "release_type=Debug" >> $GITHUB_OUTPUT
          else
            echo "release_type=Release" >> $GITHUB_OUTPUT
          fi

      - name: Download changelog
        uses: actions/download-artifact@v8
        with:
          name: release-changelog
          path: release-notes

      - name: Load release notes
        id: changelog
        run: |
          # Save to output (handle multiline)
          {
            echo "changelog<<EOF"
            cat release-notes/changelog.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Release notes:"
          cat release-notes/changelog.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Android APK
          if [ -f artifacts/android-apk/app-release.apk ]; then
            cp artifacts/android-apk/app-release.apk release-assets/rms-chatroom-${{ needs.extract-version.outputs.version_name }}.apk
          fi

          # Desktop (Tauri) - Windows only. upload-artifact roots the
          # archive at the globs' common ancestor, so files land nested
          # under the cargo target dir; match at any depth.
          if [ -d artifacts/desktop-windows ]; then
            find artifacts/desktop-windows -name '*.exe' -exec cp {} release-assets/ \;
            find artifacts/desktop-windows -name '*.exe.sig' -exec cp {} release-assets/ \;
          fi
          # The installer is a required release asset; fail the job instead
          # of silently publishing a release without it.
          if ! ls release-assets/*.exe >/dev/null 2>&1; then
            echo "::error::build-desktop produced no Windows installer artifact"
            exit 1
          fi
          # Server bundle (Go binary + web dist) and its update manifest
          if [ -d artifacts/server-bundle ]; then
            cp artifacts/server-bundle/* release-assets/
          fi

          # Structured changelog as release assets: changelog.json (single
          # version) is what already-installed older clients fetch for the
          # update dialog; changelog-history.json (rolling, newest first) is
          # what new clients fetch so skipped versions merge into one view.
          if [ -f release-notes/changelog.json ]; then
            cp release-notes/changelog.json release-assets/
          fi
          if [ -f release-notes/changelog-history.json ]; then
            cp release-notes/changelog-history.json release-assets/
          fi

          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.extract-version.outputs.tag_name }}
          name: ${{ steps.release_type.outputs.release_type }} ${{ needs.extract-version.outputs.version_name }} (Build ${{ needs.extract-version.outputs.version_code }})
          body: |
            ## ${{ steps.release_type.outputs.release_type }} ${{ needs.extract-version.outputs.version_name }}

            **Build Code:** ${{ needs.extract-version.outputs.version_code }}
            **Commit:** ${{ github.sha }}

            ---

            ## 📋 What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## 📦 Downloads

            - **Android APK:** `rms-chatroom-${{ needs.extract-version.outputs.version_name }}.apk`
            - **Windows:** `.exe` installer
            - **Server (self-update bundle):** `rms-chatroom-server-${{ needs.extract-version.outputs.version_name }}-linux-amd64.tar.gz`

            ## 📖 Installation

            ### Android
            1. Download the APK file
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK

            ### Desktop (Tauri)
            - **Windows:** Run the `.exe` installer

            ---

            *Auto-generated by GitHub Actions*
          draft: false
          prerelease: ${{ contains(needs.extract-version.outputs.version_name, '-dev') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate and upload updater latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.extract-version.outputs.tag_name }}
          VERSION_NAME: ${{ needs.extract-version.outputs.version_name }}
          VERSION_CODE: ${{ needs.extract-version.outputs.version_code }}
          RELEASE_NAME: ${{ steps.release_type.outputs.release_type }} ${{ needs.extract-version.outputs.version_name }}
        run: |
          # Build the Tauri v2 updater manifest here (tauri-action is
          # build-only in this workflow). In v2 the NSIS installer itself is
          # the updater artifact and the sibling .exe.sig holds the minisign
          # signature. The platform URL is routed through gh-proxy so
          # mainland-China clients can download the update; tauri.conf.json
          # lists the gh-proxy endpoint first for the same reason.
          #
          # notes carries the bilingual changelog as "zh half\n---\nen half";
          # AppUpdater.vue splits on the --- line and picks the locale half.
          UPDATER_EXE=$(find release-assets -maxdepth 1 -name '*-setup.exe' | head -n1)
          if [ -z "$UPDATER_EXE" ]; then
            echo "::error::no setup installer found for the updater manifest"
            exit 1
          fi
          if [ ! -f "${UPDATER_EXE}.sig" ]; then
            echo "::error::found $UPDATER_EXE but no .sig next to it" >&2
            exit 1
          fi

          export UPDATER_EXE ASSET_URL="https://github.com/Conflux-Union/rms-chatroom/releases/download/${TAG_NAME}/$(basename "$UPDATER_EXE")"
          python3 << 'PYEOF'
          import datetime
          import json
          import os

          # Values pass through os.environ instead of heredoc interpolation:
          # AI-generated bullet text could otherwise trip shell expansion.
          signature = open(os.environ["UPDATER_EXE"] + ".sig").read().strip()
          zh = open("release-notes/notes-zh.md", encoding="utf-8").read().strip()
          en = open("release-notes/notes-en.md", encoding="utf-8").read().strip()
          notes = (
              f"{os.environ['RELEASE_NAME']} (Build {os.environ['VERSION_CODE']})\n\n"
              f"{zh}\n---\n{en}"
          )
          data = {
              "version": os.environ["VERSION_NAME"],
              "notes": notes,
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "windows-x86_64": {
                      "signature": signature,
                      "url": "https://gh-proxy.com/" + os.environ["ASSET_URL"],
                  }
              },
          }
          with open("release-assets/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print(json.dumps(data, indent=2, ensure_ascii=False))
          PYEOF
          gh release upload "$TAG_NAME" release-assets/latest.json -R Conflux-Union/rms-chatroom --clobber

  deploy-server:
    name: Deploy Server (trigger self-update)
    needs: [extract-version, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # -dev prereleases never reach production
    if: ${{ !contains(needs.extract-version.outputs.version_name, '-dev') }}

    steps:
      - name: Download server bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: server-bundle
          path: server-assets

      - name: Trigger self-update and verify
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "DEPLOY_TOKEN secret not set; skipping deploy"
            exit 0
          fi
          DEPLOY_URL="${DEPLOY_URL:-https://chatroom.rms.net.cn}"
          MANIFEST=server-assets/server-latest.json
          CODE=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['code'])")

          # POST the manifest so the server can skip the mirror-dependent
          # manifest lookup and start downloading the bundle right away.
          trigger() {
            curl -sS --fail --connect-timeout 10 --max-time 60 \
              -X POST "$DEPLOY_URL/api/system/update/check?token=$DEPLOY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$MANIFEST"
          }

          # GitHub runners sit outside China and the route to the server is
          # lossy, so retry the trigger with a fixed backoff.
          triggered=0
          for attempt in $(seq 1 10); do
            if trigger; then
              triggered=1
              echo ""
              echo "trigger accepted (attempt $attempt)"
              break
            fi
            echo "trigger attempt $attempt/10 failed; retrying in 30s"
            sleep 30
          done
          if [ "$triggered" != 1 ]; then
            echo "could not reach the server to trigger the update"
            exit 1
          fi

          # The server downloads the bundle itself (through gh-proxy mirrors,
          # with its own retries), swaps the binary and restarts. Poll until
          # it reports the new build code; re-send the trigger every minute
          # in case a whole download cycle failed server-side.
          echo "waiting for the server to report build code $CODE"
          for i in $(seq 1 90); do
            sleep 10
            VERSION=$(curl -sS --connect-timeout 10 --max-time 20 "$DEPLOY_URL/api/system/version" || true)
            echo "poll $i/90: ${VERSION:-unreachable}"
            case "$VERSION" in
              *"(${CODE})(commit"*)
                echo "server updated successfully"
                exit 0
                ;;
            esac
            if [ $((i % 6)) -eq 0 ]; then
              echo "re-sending update trigger"
              trigger || true
              echo ""
            fi
          done
          echo "server did not report build code $CODE within 15 minutes"
          exit 1
