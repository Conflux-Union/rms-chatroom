name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Matches tags like v1.0.0(1), v1.0.6-fix-1(9)

jobs:
  extract-version:
    name: Extract Version Info
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.code }}
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Extract version and code from tag (e.g., v1.0.7-fix-2(33) -> 1.0.7-fix-2, 33)
          VERSION=$(echo $TAG_NAME | sed -E 's/v([^(]+)\(([^)]+)\)/\1/')
          CODE=$(echo $TAG_NAME | sed -E 's/v([^(]+)\(([^)]+)\)/\2/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT

          echo "Extracted: version=$VERSION, code=$CODE"

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: extract-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update Android version in build.gradle.kts
        run: |
          VERSION_NAME="${{ needs.extract-version.outputs.version_name }}"
          VERSION_CODE="${{ needs.extract-version.outputs.version_code }}"

          sed -i "s/val appVersionCode = [0-9]*/val appVersionCode = $VERSION_CODE/" android/app/build.gradle.kts
          sed -i "s/val appVersionName = \"[^\"]*\"/val appVersionName = \"$VERSION_NAME\"/" android/app/build.gradle.kts

          echo "Updated Android version to: $VERSION_NAME ($VERSION_CODE)"
          grep -A 2 "appVersionCode\|appVersionName" android/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode and setup keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

  build-server:
    name: Build Server Bundle
    runs-on: ubuntu-latest
    needs: extract-version

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Install dependencies
        run: pnpm install

      - name: Build web frontend
        run: pnpm build:web

      - name: Build server binary
        run: |
          VERSION_NAME="${{ needs.extract-version.outputs.version_name }}"
          VERSION_CODE="${{ needs.extract-version.outputs.version_code }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          VERSION_PKG=github.com/RMS-Server/rms-discord-go/internal/version

          mkdir -p server-bundle
          cd backend-go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X $VERSION_PKG.Name=$VERSION_NAME -X $VERSION_PKG.Code=$VERSION_CODE -X $VERSION_PKG.Commit=$COMMIT_HASH" \
            -o ../server-bundle/rms-discord-server ./cmd/server

      - name: Package server bundle and manifest
        env:
          VERSION_NAME: ${{ needs.extract-version.outputs.version_name }}
          VERSION_CODE: ${{ needs.extract-version.outputs.version_code }}
          TAG_NAME: ${{ needs.extract-version.outputs.tag_name }}
        run: |
          # Bundle layout matches what the server's self-updater extracts
          # next to its binary: the binary itself plus packages/web/dist.
          mkdir -p server-bundle/packages/web
          cp -r packages/web/dist server-bundle/packages/web/dist

          mkdir -p server-assets
          ASSET_NAME="rms-chatroom-server-${VERSION_NAME}-linux-amd64.tar.gz"
          tar -czf "server-assets/$ASSET_NAME" -C server-bundle .

          # server-latest.json is the update manifest: the deploy job POSTs
          # it to the server, and periodic self-checks fetch it from
          # releases/latest/download/ through gh-proxy mirrors.
          python3 - "$ASSET_NAME" << 'PYEOF'
          import hashlib, json, os, sys
          from urllib.parse import quote
          asset = sys.argv[1]
          sha256 = hashlib.sha256(open(f'server-assets/{asset}', 'rb').read()).hexdigest()
          tag = quote(os.environ['TAG_NAME'], safe='')
          manifest = {
              'version': os.environ['VERSION_NAME'],
              'code': int(os.environ['VERSION_CODE']),
              'url': f'https://github.com/Conflux-Union/rms-chatroom/releases/download/{tag}/{asset}',
              'sha256': sha256,
          }
          with open('server-assets/server-latest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PYEOF

      - name: Upload server bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: server-bundle
          path: server-assets/
          retention-days: 7

  build-desktop:
    name: Build Desktop (Tauri)
    runs-on: ${{ matrix.os }}
    needs: extract-version

    strategy:
      matrix:
        include:
          - os: windows-latest
            args: '--target x86_64-pc-windows-msvc'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Generate version file
        shell: bash
        run: |
          VERSION_NAME="${{ needs.extract-version.outputs.version_name }}"
          VERSION_CODE="${{ needs.extract-version.outputs.version_code }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)

          cat > packages/desktop/src/version.ts << EOF
          // Auto-generated by GitHub Actions - DO NOT EDIT
          export const VERSION_NAME = "$VERSION_NAME"
          export const VERSION_CODE = $VERSION_CODE
          export const COMMIT_HASH = "$COMMIT_HASH"
          EOF

          # Update tauri.conf.json version from tag
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version='$VERSION_NAME';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

          echo "Generated version.ts and set tauri version to $VERSION_NAME($VERSION_CODE)"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.extract-version.outputs.tag_name }}
          releaseName: 'Release ${{ needs.extract-version.outputs.version_name }}'
          releaseBody: 'Desktop app builds for Windows'
          releaseDraft: false
          prerelease: ${{ contains(needs.extract-version.outputs.version_name, '-dev') }}
          args: ${{ matrix.args }}
          updaterJsonPreferNsis: true

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: |
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [extract-version, build-android, build-desktop, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Determine release type
        id: release_type
        run: |
          VERSION="${{ needs.extract-version.outputs.version_name }}"

          # Determine release type
          if [[ $VERSION == *"-fix-"* ]] || [[ $VERSION == *"-fix" ]]; then
            echo "release_type=Hot-fix" >> $GITHUB_OUTPUT
          elif [[ $VERSION == *"-dev"* ]]; then
            echo "release_type=Debug" >> $GITHUB_OUTPUT
          else
            echo "release_type=Release" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog from commits
        id: changelog
        run: |
          # Get the previous tag
          CURRENT_TAG="${{ needs.extract-version.outputs.tag_name }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -A1 "^${CURRENT_TAG}$" | tail -n1)

          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" == "$CURRENT_TAG" ]; then
            echo "No previous tag found, using all commits"
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Generating changelog from $PREVIOUS_TAG to $CURRENT_TAG"

          # Generate changelog with conventional commit grouping
          CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s" --no-merges | awk '
          BEGIN {
            feat_count = 0
            fix_count = 0
            refactor_count = 0
            docs_count = 0
            chore_count = 0
            other_count = 0
          }
          /^feat(\(.*\))?:/ {
            feat[feat_count++] = substr($0, index($0, ":") + 2)
            next
          }
          /^fix(\(.*\))?:/ {
            fix[fix_count++] = substr($0, index($0, ":") + 2)
            next
          }
          /^refactor(\(.*\))?:/ {
            refactor[refactor_count++] = substr($0, index($0, ":") + 2)
            next
          }
          /^docs(\(.*\))?:/ {
            docs[docs_count++] = substr($0, index($0, ":") + 2)
            next
          }
          /^chore(\(.*\))?:/ {
            chore[chore_count++] = substr($0, index($0, ":") + 2)
            next
          }
          {
            other[other_count++] = $0
          }
          END {
            if (feat_count > 0) {
              print "### ✨ New Features"
              print ""
              for (i = 0; i < feat_count; i++) {
                print "- " feat[i]
              }
              print ""
            }
            if (fix_count > 0) {
              print "### 🐛 Bug Fixes"
              print ""
              for (i = 0; i < fix_count; i++) {
                print "- " fix[i]
              }
              print ""
            }
            if (refactor_count > 0) {
              print "### ♻️ Refactoring"
              print ""
              for (i = 0; i < refactor_count; i++) {
                print "- " refactor[i]
              }
              print ""
            }
            if (docs_count > 0) {
              print "### 📝 Documentation"
              print ""
              for (i = 0; i < docs_count; i++) {
                print "- " docs[i]
              }
              print ""
            }
            if (chore_count > 0) {
              print "### 🔧 Chores"
              print ""
              for (i = 0; i < chore_count; i++) {
                print "- " chore[i]
              }
              print ""
            }
            if (other_count > 0) {
              print "### 📦 Other Changes"
              print ""
              for (i = 0; i < other_count; i++) {
                print "- " other[i]
              }
              print ""
            }
          }
          ')

          # If no commits found, use a default message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No significant changes recorded."
          fi

          # Save to output (handle multiline)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Generated changelog:"
          echo "$CHANGELOG"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Android APK
          if [ -f artifacts/android-apk/app-release.apk ]; then
            cp artifacts/android-apk/app-release.apk release-assets/rms-chatroom-${{ needs.extract-version.outputs.version_name }}.apk
          fi

          # Desktop apps (Tauri) - Windows only
          if [ -d artifacts/desktop-windows ]; then
            cp artifacts/desktop-windows/*.exe release-assets/ 2>/dev/null || true
            cp artifacts/desktop-windows/*.msi release-assets/ 2>/dev/null || true
          fi

          # Server bundle (Go binary + web dist) and its update manifest
          if [ -d artifacts/server-bundle ]; then
            cp artifacts/server-bundle/* release-assets/
          fi

          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.extract-version.outputs.tag_name }}
          name: ${{ steps.release_type.outputs.release_type }} ${{ needs.extract-version.outputs.version_name }} (Build ${{ needs.extract-version.outputs.version_code }})
          body: |
            ## ${{ steps.release_type.outputs.release_type }} ${{ needs.extract-version.outputs.version_name }}

            **Build Code:** ${{ needs.extract-version.outputs.version_code }}
            **Commit:** ${{ github.sha }}

            ---

            ## 📋 What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## 📦 Downloads

            - **Android APK:** `rms-chatroom-${{ needs.extract-version.outputs.version_name }}.apk`
            - **Windows:** `.exe` installer
            - **Server (self-update bundle):** `rms-chatroom-server-${{ needs.extract-version.outputs.version_name }}-linux-amd64.tar.gz`

            ## 📖 Installation

            ### Android
            1. Download the APK file
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK

            ### Desktop (Tauri)
            - **Windows:** Run the `.exe` installer

            ---

            *Auto-generated by GitHub Actions*
          draft: false
          prerelease: ${{ contains(needs.extract-version.outputs.version_name, '-dev') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Route updater download URL through China mirror
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.extract-version.outputs.tag_name }}
        run: |
          # tauri-action uploads latest.json pointing at the official GitHub
          # asset URL, which is unreachable from mainland China. Rewrite the
          # platform download URLs through gh-proxy; signature/version/pub_date
          # are left exactly as tauri-action produced them.
          if ! gh release download "$TAG_NAME" -R Conflux-Union/rms-chatroom -p latest.json -D /tmp --clobber 2>/dev/null; then
            echo "latest.json not found in release; skipping URL rewrite"
            exit 0
          fi
          python3 << 'PYEOF'
          import json
          path = '/tmp/latest.json'
          with open(path) as f:
              data = json.load(f)
          mirror = 'https://gh-proxy.com/'
          for info in data.get('platforms', {}).values():
              url = info.get('url', '')
              if url.startswith('https://github.com/') and not url.startswith(mirror):
                  info['url'] = mirror + url
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
          print(json.dumps(data, indent=2))
          PYEOF
          gh release upload "$TAG_NAME" /tmp/latest.json -R Conflux-Union/rms-chatroom --clobber

  deploy-server:
    name: Deploy Server (trigger self-update)
    needs: [extract-version, create-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # -dev prereleases never reach production
    if: ${{ !contains(needs.extract-version.outputs.version_name, '-dev') }}

    steps:
      - name: Download server bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: server-bundle
          path: server-assets

      - name: Trigger self-update and verify
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "DEPLOY_TOKEN secret not set; skipping deploy"
            exit 0
          fi
          DEPLOY_URL="${DEPLOY_URL:-https://chatroom.rms.net.cn}"
          MANIFEST=server-assets/server-latest.json
          CODE=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['code'])")

          # POST the manifest so the server can skip the mirror-dependent
          # manifest lookup and start downloading the bundle right away.
          trigger() {
            curl -sS --fail --connect-timeout 10 --max-time 60 \
              -X POST "$DEPLOY_URL/api/system/update/check?token=$DEPLOY_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$MANIFEST"
          }

          # GitHub runners sit outside China and the route to the server is
          # lossy, so retry the trigger with a fixed backoff.
          triggered=0
          for attempt in $(seq 1 10); do
            if trigger; then
              triggered=1
              echo ""
              echo "trigger accepted (attempt $attempt)"
              break
            fi
            echo "trigger attempt $attempt/10 failed; retrying in 30s"
            sleep 30
          done
          if [ "$triggered" != 1 ]; then
            echo "could not reach the server to trigger the update"
            exit 1
          fi

          # The server downloads the bundle itself (through gh-proxy mirrors,
          # with its own retries), swaps the binary and restarts. Poll until
          # it reports the new build code; re-send the trigger every minute
          # in case a whole download cycle failed server-side.
          echo "waiting for the server to report build code $CODE"
          for i in $(seq 1 90); do
            sleep 10
            VERSION=$(curl -sS --connect-timeout 10 --max-time 20 "$DEPLOY_URL/api/system/version" || true)
            echo "poll $i/90: ${VERSION:-unreachable}"
            case "$VERSION" in
              *"(${CODE})(commit"*)
                echo "server updated successfully"
                exit 0
                ;;
            esac
            if [ $((i % 6)) -eq 0 ]; then
              echo "re-sending update trigger"
              trigger || true
              echo ""
            fi
          done
          echo "server did not report build code $CODE within 15 minutes"
          exit 1
