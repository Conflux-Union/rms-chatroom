name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["PR Checks"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Auto-merge Dependabot PR
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          PRS='${{ github.event.workflow_run.pull_requests }}'

          echo "$PRS" | jq -r '.[] | .number' | while read PR_NUMBER; do
            PR_DATA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER")
            PR_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')
            AUTHOR=$(echo "$PR_DATA" | jq -r '.user.login')

            if [ "$PR_SHA" != "$HEAD_SHA" ]; then
              echo "PR #$PR_NUMBER: head sha mismatch ($PR_SHA vs $HEAD_SHA), skipping"
              continue
            fi

            if [ "$AUTHOR" != "dependabot[bot]" ]; then
              echo "PR #$PR_NUMBER: author is $AUTHOR, not dependabot[bot], skipping"
              continue
            fi

            echo "Merging PR #$PR_NUMBER"
            gh pr merge --squash "$PR_NUMBER" --repo "${{ github.repository }}"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
